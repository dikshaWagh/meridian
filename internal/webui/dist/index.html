<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6fa" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Meridian — private AI pooled across the machines on your network. One gateway, live model instances, failover-aware routing."
    />
    <title>Meridian</title>
    <script>
      // Pick the theme before first paint so light and dark both start clean.
      (function () {
        try {
          var saved = localStorage.getItem('meridian-theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (err) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
